name: Android Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    environment: myapp
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || vars.MAPS_API_KEY || '' }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN || vars.MAPBOX_ACCESS_TOKEN || '' }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN || vars.MAPBOX_DOWNLOADS_TOKEN || '' }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@v3

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          [ -n "$MAPS_API_KEY" ] && echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          [ -n "$MAPBOX_ACCESS_TOKEN" ] && echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN" >> local.properties

      - name: Inject Mapbox downloads token into gradle.properties
        if: ${{ env.MAPBOX_DOWNLOADS_TOKEN != '' }}
        run: |
          sed -i "s|YOUR_MAPBOX_SECRET_TOKEN|${MAPBOX_DOWNLOADS_TOKEN}|g" gradle.properties

      - name: Decode google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          # Accept either raw JSON secret or base64-encoded JSON secret
          if jq -e . >/dev/null 2>&1 <<<"$GOOGLE_SERVICES_JSON"; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 --decode > app/google-services.json 2>/dev/null \
            && jq -e . app/google-services.json >/dev/null 2>&1; then
            echo "Decoded GOOGLE_SERVICES_JSON from base64"
          else
            echo "::error::GOOGLE_SERVICES_JSON is neither valid JSON nor valid base64-encoded JSON"
            exit 1
          fi

      - name: Ensure debug Firebase client exists
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          if jq -e '.client[]?.client_info.android_client_info.package_name == "com.alignify.debug"' app/google-services.json >/dev/null; then
            echo "google-services.json already contains com.alignify.debug"
          elif jq -e '.client[]?.client_info.android_client_info.package_name == "com.alignify"' app/google-services.json >/dev/null; then
            jq '
              (.client[] | select(.client_info.android_client_info.package_name == "com.alignify")) as $base
              | .client += [
                (
                  $base
                  | .client_info.android_client_info.package_name = "com.alignify.debug"
                  | if has("oauth_client") then
                      .oauth_client |= map(
                        if has("android_info") and .android_info.package_name == "com.alignify" then
                          .android_info.package_name = "com.alignify.debug"
                        else
                          .
                        end
                      )
                    else
                      .
                    end
                )
              ]
            ' app/google-services.json > app/google-services.tmp.json
            mv app/google-services.tmp.json app/google-services.json
            echo "Added derived com.alignify.debug client for CI debug build"
          else
            echo "::warning::No com.alignify client found to derive com.alignify.debug"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --build-cache

      - name: Run Android Lint
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew lint --parallel --build-cache

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-*.html
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: myapp
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || vars.MAPS_API_KEY || '' }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN || vars.MAPBOX_ACCESS_TOKEN || '' }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN || vars.MAPBOX_DOWNLOADS_TOKEN || '' }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate signing secrets
        run: |
          missing=""
          [ -z "$MAPBOX_DOWNLOADS_TOKEN" ] && missing="$missing MAPBOX_DOWNLOADS_TOKEN"
          [ -z "$GOOGLE_SERVICES_JSON" ] && missing="$missing GOOGLE_SERVICES_JSON"
          [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]   && missing="$missing KEYSTORE_BASE64"
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "${{ secrets.KEY_ALIAS }}" ]         && missing="$missing KEY_ALIAS"
          [ -z "${{ secrets.KEY_PASSWORD }}" ]      && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release requires the following GitHub Secrets:$missing"
            echo "Add them under Settings → Secrets and Variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          [ -n "$MAPS_API_KEY" ] && echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          [ -n "$MAPBOX_ACCESS_TOKEN" ] && echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN" >> local.properties

      - name: Inject Mapbox downloads token into gradle.properties
        run: |
          sed -i "s|YOUR_MAPBOX_SECRET_TOKEN|${MAPBOX_DOWNLOADS_TOKEN}|g" gradle.properties

      - name: Decode google-services.json
        run: |
          # Accept either raw JSON secret or base64-encoded JSON secret
          if jq -e . >/dev/null 2>&1 <<<"$GOOGLE_SERVICES_JSON"; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 --decode > app/google-services.json 2>/dev/null \
            && jq -e . app/google-services.json >/dev/null 2>&1; then
            echo "Decoded GOOGLE_SERVICES_JSON from base64"
          else
            echo "::error::GOOGLE_SERVICES_JSON is neither valid JSON nor valid base64-encoded JSON"
            exit 1
          fi

      - name: Decode Keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --parallel --build-cache

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (Signed)
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: Alignify v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
